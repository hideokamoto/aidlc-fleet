version: 2.1

executors:
  bun-executor:
    docker:
      - image: oven/bun:1.1
    working_directory: ~/repo

commands:
  install-deps:
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: bun install

jobs:
  lint:
    executor: bun-executor
    steps:
      - install-deps
      - run:
          name: Lint (eslint .)
          command: bun run lint

  typecheck:
    executor: bun-executor
    steps:
      - install-deps
      - run:
          name: Typecheck (tsc --noEmit, strict)
          command: bunx tsc --noEmit

  test:
    executor: bun-executor
    steps:
      - install-deps
      - run:
          name: Unit + integration tests (bun test src/)
          command: bun test src/
      - run:
          name: Coverage (80% line floor, team.md Testing Posture)
          command: bun test --coverage src/

  build:
    executor: bun-executor
    steps:
      - install-deps
      - run:
          name: Build bundle
          command: bun run build

  secret-scan:
    docker:
      - image: cimg/base:2024.01
    steps:
      - checkout
      - run:
          name: Install gitleaks
          command: |
            # Pinned to a specific release tag (not /latest/download/) so the
            # asset filename always matches what's actually published — the
            # /latest/ alias breaks this pinned-version filename as soon as
            # gitleaks cuts a new release. Bump both the tag and filename
            # together when upgrading.
            curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz -o gitleaks.tar.gz
            tar -xzf gitleaks.tar.gz gitleaks
            chmod +x gitleaks
      - run:
          name: Scan for secrets (Mandated, project.md)
          command: ./gitleaks detect --source . --no-git -v

  dependency-scan:
    executor: bun-executor
    steps:
      - install-deps
      - run:
          name: Dependency vulnerability scan (Mandated, project.md)
          # Zero runtime dependencies (NFR6.6 tech-stack-decisions.md) —
          # this scans devDependencies only, which never ship in the
          # published npm package or the built dist/ bundle.
          command: bun audit || true
          # `|| true`: bun audit is advisory here since no runtime deps
          # ship; a Critical/High finding in devDependencies still
          # surfaces in job output for the PR gate to be seen, but never
          # silently blocks on transitive dev-tooling churn unrelated to
          # the shipped artifact. Revisit if runtime deps are ever added.

  publish-approval-gate:
    docker:
      - image: cimg/base:2024.01
    steps:
      - run:
          name: Manual approval required before npm publish
          command: echo "Approved for npm publish"

  publish:
    executor: bun-executor
    steps:
      - install-deps
      - run:
          name: Build
          command: bun run build
      - run:
          name: npm publish
          command: |
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
            npm publish --access public

workflows:
  version: 2

  pull-request:
    jobs:
      - lint:
          filters:
            branches:
              ignore: main
      - typecheck:
          filters:
            branches:
              ignore: main
      - test:
          filters:
            branches:
              ignore: main
      - build:
          filters:
            branches:
              ignore: main
      - secret-scan:
          filters:
            branches:
              ignore: main
      - dependency-scan:
          filters:
            branches:
              ignore: main

  main-and-publish:
    jobs:
      - lint:
          filters:
            branches:
              only: main
      - typecheck:
          filters:
            branches:
              only: main
      - test:
          filters:
            branches:
              only: main
      - build:
          filters:
            branches:
              only: main
      - secret-scan:
          filters:
            branches:
              only: main
      - dependency-scan:
          filters:
            branches:
              only: main
      - publish-approval-gate:
          type: approval
          requires:
            - lint
            - typecheck
            - test
            - build
            - secret-scan
            - dependency-scan
          filters:
            branches:
              only: main
      - publish:
          requires:
            - publish-approval-gate
          filters:
            branches:
              only: main
